name: Publish backend image
on:
  push:
    branches:
      - Fullstack-DEV
    paths:
      - "server/**"
      - ".github/workflows/publish-backend.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/ahmed-saedd-dev/t-kpi-backend:latest
            ghcr.io/ahmed-saedd-dev/t-kpi-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
