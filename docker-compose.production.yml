name: talabat-kpi-production
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./.env.production
    ports:
      - "127.0.0.1:54333:5432"
    volumes:
      - talabat_kpi_postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - talabat_kpi_redis_prod:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    image: ghcr.io/ahmed-saedd-dev/t-kpi-backend:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      PORT: "3000"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:3000"]
    depends_on:
      app:
        condition: service_healthy
volumes:
  talabat_kpi_postgres_prod:
  talabat_kpi_redis_prod:
