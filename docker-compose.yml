
services:
  postgres:
    image: postgres:17-alpine
    container_name: talabat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talabat_kpi
      POSTGRES_USER: talabat_user
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "127.0.0.1:54332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talabat_user -d talabat_kpi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talabat-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: talabat-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./server/.env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://talabat_user:dev_password_change_me@postgres:5432/talabat_kpi
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
